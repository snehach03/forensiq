[project]
name = "forensiq"
version = "0.1.0"
description = "AI-powered financial forensics platform analyzing SEC filings"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "sqlalchemy>=2.0",
    "pymysql>=1.1",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "requests>=2.31",
    "python-dotenv>=1.0",
    "pandas>=2.0",
    "numpy>=1.26",
    "scikit-learn>=1.4",
    "scipy>=1.11",
    "imbalanced-learn>=0.12",
    "shap>=0.44",
    "joblib>=1.3",
    "matplotlib>=3.8",
    "groq>=0.4",
    "streamlit>=1.30",
    "plotly>=5.18",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=4.1",
    "responses>=0.25",
    "black>=24.0",
    "ruff>=0.3",
]

[tool.setuptools.packages.find]
where = ["src"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"